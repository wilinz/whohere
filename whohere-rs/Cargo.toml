[package]
name = "whohere"
version = "1.0.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "whohere"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 只为了 SO_REUSEPORT / 按接口加入组播组(std 不暴露这些), 依赖极轻
socket2 = { version = "0.5", features = ["all"] }
# 只用来接 SIGTERM, 好在退出前把设备档案落盘
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
